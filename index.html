<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0F0D">
<title>ARCADIA — Café · Billard royal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F0D; --panel:#111915; --panel2:#17211C; --text:#E8EEE9; --muted:#93A198; --border:#25322B;
  --felt:#2E9D76; --felt-d:#1B6B4F; --felt-dd:#0F3D2D; --brass:#D8A94A; --brass-d:#8F6B25;
  --ok:#4CC38A; --warn:#E3A64A; --crit:#F0736A;
  --r:14px; --r-sm:9px;
  --f-num:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --f-txt:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --top:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-txt);font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--felt)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .crit{color:var(--crit)} .brass{color:var(--brass)}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}

/* ---------- Top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:40;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(180deg,#0d1411,#0A0F0D);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logo{font-family:var(--f-num);font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--brass);line-height:1}
.logo b{color:var(--felt);font-weight:800}
.tagline{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);
  font-size:13px;cursor:pointer;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(76,195,138,.18)}
.pill.half .dot{background:var(--warn)}
.pill.off .dot{background:var(--crit)}
.spacer{flex:1}
.clock{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.clock small{font-family:var(--f-txt);font-size:11px;color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:0}
.user-sel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.user-sel select{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;color:var(--text);min-width:150px}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;border:1px solid var(--border);
  background:var(--panel);cursor:pointer;color:var(--text);transition:.15s}
.icon-btn:hover{border-color:var(--felt)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:32px;height:32px;border-radius:9px;font-size:18px}
.icon-btn.mgr{background:rgba(216,169,74,.14);border-color:var(--brass);color:var(--brass)}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--crit);color:#1a0906;
  font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--f-txt)}
.badge.warn{background:var(--warn)}
.badge[hidden]{display:none}
.bell-panel{position:fixed;top:calc(var(--top) + 6px);right:16px;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;z-index:45;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.55);padding:10px}
.bell-panel h4{margin:6px 8px 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Tabs ---------- */
.tabs{position:sticky;top:var(--top);z-index:30;display:flex;gap:4px;padding:10px 18px 0;margin-top:var(--top);background:var(--bg);
  border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px 12px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--felt)}
.tab .lk{display:inline-flex;opacity:.7;color:var(--brass)}
.tab .lk svg{width:12px;height:12px}
.tab .cnt{background:var(--felt);color:#04150e;border-radius:8px;font-size:11px;padding:1px 6px;font-weight:700}

main{padding:20px 18px 60px;max-width:1500px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-family:var(--f-num);font-weight:700;font-size:34px;letter-spacing:.03em;margin:0;line-height:1}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:14px}

/* ---------- Generic UI ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-family:var(--f-num);font-size:34px;font-weight:700;margin-top:4px;line-height:1.05}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.accent::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--felt)}
.kpi.brass::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#3a4c42;background:#1c2822}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--felt);border-color:var(--felt);color:#03140d}
.btn.primary:hover{background:#35b087}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#1c1405}
.btn.danger{background:transparent;border-color:rgba(240,115,106,.5);color:var(--crit)}
.btn.danger:hover{background:rgba(240,115,106,.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 18px;font-size:16px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--panel2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(76,195,138,.4);background:rgba(76,195,138,.08)}
.chip.warn{color:var(--warn);border-color:rgba(227,166,74,.4);background:rgba(227,166,74,.08)}
.chip.crit{color:var(--crit);border-color:rgba(240,115,106,.45);background:rgba(240,115,106,.08)}
.chip.brass{color:var(--brass);border-color:rgba(216,169,74,.45);background:rgba(216,169,74,.08)}
.chip.green{color:var(--felt);border-color:rgba(46,157,118,.45);background:rgba(46,157,118,.1)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--felt);color:#03140d}
label.f,div.f{display:block;font-size:12px;color:var(--muted);margin-bottom:12px;letter-spacing:.02em}
label.f > span,div.f > span{display:block;margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font-size:15px}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--felt);box-shadow:0 0 0 3px rgba(46,157,118,.18)}
input.in.big{font-family:var(--f-num);font-size:28px;font-weight:700;padding:8px 12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--felt);width:17px;height:17px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid rgba(37,50,43,.6);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.void td{opacity:.45;text-decoration:line-through}
table.t td.r,table.t th.r{text-align:right}
.tscroll{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid transparent}
.list-item + .list-item{border-top:1px solid rgba(37,50,43,.6)}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);margin-bottom:8px;font-size:14px;cursor:pointer}
.alert-item .ai{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert-item.crit .ai{background:var(--crit)} .alert-item.warn .ai{background:var(--warn)} .alert-item.info .ai{background:var(--felt)}
.alert-item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* ---------- Billard tables ---------- */
.bt-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.bt{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:.2s}
.bt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bt-name{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:.03em;line-height:1}
.bt-rate{font-size:12px;color:var(--muted);margin-top:4px}
.felt{position:relative;border-radius:14px;padding:22px 16px 18px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%, #2a8a67 0%, var(--felt-d) 55%, var(--felt-dd) 100%);
  border:7px solid #3a2a17;box-shadow:inset 0 0 0 2px rgba(216,169,74,.35), inset 0 0 30px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.35)}
.felt .pk{position:absolute;width:12px;height:12px;border-radius:50%;background:#050806}
.felt .pk.a{top:4px;left:4px}.felt .pk.b{top:4px;right:4px}.felt .pk.c{bottom:4px;left:4px}.felt .pk.d{bottom:4px;right:4px}
.felt .pk.e{top:2px;left:calc(50% - 6px)}.felt .pk.f{bottom:2px;left:calc(50% - 6px)}
.timer{font-family:var(--f-num);font-weight:800;font-size:52px;line-height:1;letter-spacing:.04em;color:#F3F7F4;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.cost{font-family:var(--f-num);font-size:24px;font-weight:700;color:var(--brass);margin-top:6px}
.felt .meta{font-size:12px;color:rgba(232,238,233,.8);margin-top:8px;min-height:16px}
.bt.st-free .felt{filter:saturate(.45) brightness(.7)}
.bt.st-free .timer{color:rgba(232,238,233,.55)}
.bt.st-run{border-color:rgba(46,157,118,.55);box-shadow:0 0 0 1px rgba(46,157,118,.2),0 10px 30px rgba(46,157,118,.08)}
.bt.st-pause{border-color:rgba(227,166,74,.55)}
.bt.st-pause .felt{filter:saturate(.6)}
.bt.st-pause .timer{color:var(--warn)}
.bt.st-over{border-color:rgba(240,115,106,.6);box-shadow:0 0 0 1px rgba(240,115,106,.2)}
.bt.st-over .timer{color:#ffd5d1}
.bt.st-resa{border-color:rgba(216,169,74,.55)}
.bt-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.bt-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bt-actions .wide{grid-column:1/-1}
.mini-tables{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.mt{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--panel2);cursor:pointer}
.mt .n{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.mt .tm{font-family:var(--f-num);font-size:28px;font-weight:700;margin-top:4px}
.mt .c{font-family:var(--f-num);font-size:16px;color:var(--brass)}
.mt.free{opacity:.55}.mt.free .tm{color:var(--muted)}
.mt.run{border-color:rgba(46,157,118,.5)}.mt.pause{border-color:rgba(227,166,74,.5)}.mt.over{border-color:rgba(240,115,106,.6)}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:230px minmax(0,1fr) 370px;gap:14px;align-items:start}
.pos-locs{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--top) + 64px)}
.loc-group h5{margin:0 0 7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.loc-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.loc-list.one{grid-template-columns:1fr}
.loc-list.two{grid-template-columns:1fr 1fr}
.loc{position:relative;padding:9px 6px;border-radius:9px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;text-align:center}
.loc:hover{border-color:#3a4c42}
.loc.busy{background:rgba(46,157,118,.12);border-color:rgba(46,157,118,.45)}
.loc.sel{background:var(--felt);border-color:var(--felt);color:#03140d}
.loc:disabled{opacity:.35;cursor:not-allowed}
.loc .amt{display:block;font-family:var(--f-num);font-size:13px;font-weight:600;opacity:.85}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat{padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.cat.on{color:#1c1405;background:var(--brass);border-color:var(--brass)}
.prod-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
.prod{position:relative;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);cursor:pointer;min-height:92px;
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:.1s}
.prod:hover{border-color:var(--felt);transform:translateY(-1px)}
.prod:active{transform:scale(.98)}
.prod .pn{font-weight:600;font-size:14px;line-height:1.25}
.prod .pp{font-family:var(--f-num);font-size:22px;font-weight:700;color:var(--brass)}
.prod .pp small{font-size:13px;color:var(--muted)}
.prod .ps{position:absolute;bottom:12px;right:10px;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.prod .ps.low{color:var(--warn);border-color:rgba(227,166,74,.45)}
.prod .ps.out{color:var(--crit);border-color:rgba(240,115,106,.5)}
.prod.out{opacity:.45}
.cart{position:sticky;top:calc(var(--top) + 64px);display:flex;flex-direction:column;max-height:calc(100vh - var(--top) - 84px)}
.cart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.cart-head .ln{font-family:var(--f-num);font-size:28px;font-weight:700;line-height:1}
.cart-lines{flex:1;overflow:auto;margin:0 -6px;padding:0 6px;min-height:120px}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(37,50,43,.7)}
.cl .nm{font-weight:600;font-size:14px}
.cl .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.cl .tt{font-family:var(--f-num);font-size:18px;font-weight:700;min-width:62px;text-align:right}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;font-weight:700}
.qty span{min-width:22px;text-align:center;font-family:var(--f-num);font-size:18px;font-weight:700}
.cl.bill{background:rgba(46,157,118,.07);border-radius:10px;padding:9px 8px;border:1px dashed rgba(46,157,118,.4);margin-bottom:6px}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 10px;border-top:1px solid var(--border);margin-top:6px}
.cart-total .v{font-family:var(--f-num);font-size:40px;font-weight:800;color:var(--text)}
.cart-total .v small{font-size:18px;color:var(--muted)}

/* ---------- Pay modal ---------- */
.pay-lines{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;max-height:210px;overflow:auto}
.pay-lines div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.pay-total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0}
.pay-total .v{font-family:var(--f-num);font-size:48px;font-weight:800;color:var(--brass);line-height:1}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:7px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;font-family:var(--f-num);font-size:17px;font-weight:700}
.change{font-family:var(--f-num);font-size:30px;font-weight:700}

/* ---------- Bars ---------- */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-l{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--felt);border-radius:6px}
.bar-v{font-family:var(--f-num);font-size:16px;font-weight:600;text-align:right;min-width:78px}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.cols .c i{display:block;width:100%;max-width:38px;background:var(--felt);border-radius:5px 5px 2px 2px;min-height:2px}
.cols .c span{font-size:11px;color:var(--muted);white-space:nowrap}
.cols .c b{font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--muted)}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,6,5,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(720px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.m-head h3{margin:0;font-family:var(--f-num);font-size:24px;font-weight:700;letter-spacing:.03em}
.m-body{padding:18px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--felt);padding:11px 16px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;animation:fade .2s;max-width:90vw}
.toast.warn{border-left-color:var(--warn)} .toast.crit{border-left-color:var(--crit)}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:6px 0 18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brass)}
.pin-dots i.f{background:var(--brass)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pin-pad button{height:56px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);font-family:var(--f-num);font-size:26px;font-weight:700;cursor:pointer}
.pin-pad button:hover{border-color:var(--brass)}
.ticket-preview{font-family:var(--f-mono);font-size:12.5px;background:#f4f1ea;color:#111;border-radius:6px;padding:16px 14px;white-space:pre;overflow:auto;line-height:1.45}

#print-area{display:none}
@media print{
  @page{size:80mm auto;margin:3mm}
  html,body{background:#fff!important;color:#000!important}
  body > *:not(#print-area){display:none!important}
  #print-area{display:block!important;font-family:var(--f-mono);font-size:11px;color:#000;white-space:pre;line-height:1.35}
  #print-area.a4{white-space:normal;font-family:var(--f-txt);font-size:12px}
}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .pos{grid-template-columns:200px minmax(0,1fr)}
  .cart{grid-column:1/-1;position:static;max-height:none}
}
@media (max-width:980px){
  .tagline,.clock small{display:none}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  :root{--top:0px}
  .topbar{position:static;flex-wrap:wrap;height:auto;padding:10px 12px;gap:8px 10px}
  .logo{font-size:24px}
  .brand{order:1}.clock{order:2;font-size:22px;margin-left:auto}
  .tabs{margin-top:0}
  .cart,.pos-locs{top:56px}
  #bell{order:3}#lock{order:4}
  .pill{order:5;flex:1 1 55%;max-width:none;min-width:0}
  .user-sel{order:6}.user-sel > span{display:none}.user-sel select{min-width:0;width:130px}
  .spacer{display:none}
  .tabs{padding:6px 12px 0}
  main{padding:16px 12px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .pos{grid-template-columns:1fr}
  .pos-locs{position:static}
  .loc-list{grid-template-columns:repeat(5,1fr)}
  .timer{font-size:44px}
  .page-head h1{font-size:28px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">ARC<b>A</b>DIA</span><span class="tagline">Café · Billard royal</span></div>
  <button id="status-pill" class="pill off" data-act="goCaisse" title="État de la journée et du shift"><span class="dot"></span><span id="status-txt">Journée fermée</span></button>
  <div class="spacer"></div>
  <div id="clock" class="clock">--:--</div>
  <label class="user-sel"><span>Sur l’appareil</span><select id="device-user" aria-label="Employé qui utilise l’appareil"></select></label>
  <button id="bell" class="icon-btn" data-act="toggleBell" aria-label="Alertes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg>
    <span id="bell-count" class="badge" hidden>0</span>
  </button>
  <button id="lock" class="icon-btn" data-act="toggleManager" aria-label="Mode gérant"></button>
</header>
<div id="bell-panel" class="bell-panel" hidden></div>
<nav id="tabs" class="tabs"></nav>
<main id="view"></main>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="print-area"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
'use strict';
/* =====================================================================
   ARCADIA — Café · Billard royal  ·  POS monopage (données locales)
   ===================================================================== */

const LS_KEY = 'arcadia.pos.v1';
const DAY_MS = 86400000;
const ROLES = ['Gérant', 'Responsable', 'Caissier', 'Serveur'];
const METHODS = { especes: 'Espèces', carte: 'Carte', offert: 'Offert' };
const IC = {
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  unlock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
};

/* ---------------------------- Utilitaires ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const num = n => r2(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/[  ]/g, ' ');
const dh = n => num(n) + ' DH';
const dh0 = n => Math.round(+n || 0).toLocaleString('fr-FR').replace(/[  ]/g, ' ') + ' DH';
const pad = (n, l = 2) => String(n).padStart(l, '0');
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ddmmyy = ts => { const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dur = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };
const durShort = min => { min = Math.round(min); const h = Math.floor(min / 60); return h ? `${h}h${pad(min % 60)}` : `${min} min`; };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const WD = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

/* ------------------------------ État ------------------------------ */
let S;
const ui = {
  tab: 'dash', posLoc: 'CPT', posCat: 'all', posSearch: '', manager: false, managerUntil: 0,
  ticketsFilter: 'day', ticketsSearch: '', reportRange: 'today', stockCat: 'all', stockSearch: '',
  bell: false, modal: null,
};

function seed() {
  const cats = [
    { id: 'cafe', name: 'Cafés' }, { id: 'the', name: 'Thés & infusions' }, { id: 'jus', name: 'Jus & smoothies' },
    { id: 'frais', name: 'Boissons fraîches' }, { id: 'vien', name: 'Viennoiseries' }, { id: 'snack', name: 'Snacks & salé' },
    { id: 'dessert', name: 'Desserts' },
  ];
  const P = (name, cat, price, stock = null, low = 5) => ({ id: uid(), name, cat, price, track: stock !== null, stock: stock ?? 0, low, active: true });
  const products = [
    P('Espresso', 'cafe', 10), P('Café noir', 'cafe', 10), P('Café crème', 'cafe', 12), P('Nous-nous', 'cafe', 12),
    P('Cappuccino', 'cafe', 15), P('Café latte', 'cafe', 16), P('Chocolat chaud', 'cafe', 15),
    P('Thé à la menthe (verre)', 'the', 10), P('Théière menthe 2 pers.', 'the', 20), P('Infusion', 'the', 12),
    P('Jus d’orange pressé', 'jus', 15), P('Jus d’avocat', 'jus', 22), P('Panaché', 'jus', 20), P('Citronnade', 'jus', 12),
    P('Smoothie fruits rouges', 'jus', 25), P('Milkshake', 'jus', 25),
    P('Sidi Ali 50 cl', 'frais', 6, 48, 12), P('Oulmès', 'frais', 8, 36, 10), P('Coca-Cola 33 cl', 'frais', 10, 48, 12),
    P('Fanta', 'frais', 10, 24, 8), P('Poms', 'frais', 8, 24, 8), P('Hawaï', 'frais', 10, 24, 8), P('Schweppes Tonic', 'frais', 10, 18, 6),
    P('Red Bull', 'frais', 25, 12, 4),
    P('Croissant', 'vien', 5, 30, 8), P('Pain au chocolat', 'vien', 6, 30, 8), P('Msemen', 'vien', 6, 20, 6),
    P('Harcha', 'vien', 5, 20, 6), P('Baghrir', 'vien', 6, 15, 5),
    P('Sandwich thon', 'snack', 25, 15, 4), P('Panini poulet', 'snack', 30, 15, 4), P('Omelette fromage', 'snack', 20),
    P('Chips', 'snack', 5, 30, 10), P('Cacahuètes', 'snack', 5, 30, 10),
    P('Crêpe chocolat', 'dessert', 18), P('Gaufre', 'dessert', 18), P('Glace 2 boules', 'dessert', 15, 20, 5),
  ];
  const tables = [1, 2, 3, 4, 5].map(i => ({ id: 'B' + i, name: 'Royale ' + i, rate: 40, session: null, resa: null }))
    .concat([{ id: 'B6', name: 'Royale VIP', rate: 60, session: null, resa: null }]);
  const employees = [
    { id: uid(), name: 'Youssef', role: 'Gérant', active: true },
    { id: uid(), name: 'Salma', role: 'Responsable', active: true },
    { id: uid(), name: 'Karim', role: 'Caissier', active: true },
    { id: uid(), name: 'Hamza', role: 'Serveur', active: true },
    { id: uid(), name: 'Imane', role: 'Serveur', active: true },
  ];
  return {
    v: 1,
    settings: {
      name: 'ARCADIA', tagline: 'Café · Billard royal', address: 'Casablanca', phone: '', footer: 'Merci de votre visite · À bientôt !',
      managerPin: '1234', salleCount: 10, defaultFloat: 500,
      billing: { block: 5, min: 15, round: 1 },
      alertTableMin: 180, alertPauseMin: 15, alertTabMin: 90, staffMaxDiscount: 10, voidGraceSec: 120,
    },
    cats, products, tables, employees,
    deviceUser: '',
    day: null, shift: null, tabs: {},
    sales: [], moves: [], shifts: [], days: [], stockLog: [], log: [],
    seq: { ticket: 1, shift: 1 },
  };
}

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { S = Object.assign(seed(), JSON.parse(raw)); S.settings = Object.assign(seed().settings, S.settings); return; }
  } catch (e) { console.warn(e); }
  S = seed(); save();
}
function save() {
  if (S.log.length > 800) S.log = S.log.slice(-600);
  if (S.stockLog.length > 800) S.stockLog = S.stockLog.slice(-600);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast('Sauvegarde locale impossible (stockage plein ?)', 'crit'); }
}
function log(msg) { S.log.push({ at: Date.now(), by: me()?.name || '—', msg }); }

/* ------------------------------ Accès ------------------------------ */
const emp = id => S.employees.find(e => e.id === id);
const me = () => { const e = emp(S.deviceUser); return e && e.active ? e : null; };
const isMgr = () => ui.manager && Date.now() < ui.managerUntil;
const bumpMgr = () => { if (isMgr()) ui.managerUntil = Date.now() + 10 * 60000; };
function withMgr(fn) { if (isMgr()) { bumpMgr(); fn(); } else openPin(fn); }
function needUser() {
  const u = me();
  if (!u) { toast('Choisissez d’abord l’employé qui utilise l’appareil (en haut).', 'warn'); $('#device-user').focus(); return null; }
  return u;
}
function canSell() {
  if (!S.day) { toast('La journée n’est pas ouverte — ouvrez-la dans « Caisse & shifts ».', 'warn'); return null; }
  if (!S.shift) { toast('Aucun shift ouvert — ouvrez un shift dans « Caisse & shifts ».', 'warn'); return null; }
  return needUser();
}

/* --------------------------- Métier billard --------------------------- */
const B = () => S.settings.billing;
const tableById = id => S.tables.find(t => t.id === id);
function sessionMin(s, now = Date.now()) { const end = s.pausedAt || now; return Math.max(0, (end - s.start - s.pausedMs) / 60000); }
function rateCost(min, rate) { const b = B(); const blk = Math.max(1, +b.block || 1); return Math.ceil(min / blk - 1e-9) * blk * rate / 60; }
function sessionCost(t, now = Date.now()) {
  const s = t.session; if (!s) return 0;
  const cur = sessionMin(s, now);
  let c = (s.carry || 0) + rateCost(cur, t.rate);
  c = Math.max(c, (+B().min || 0) * t.rate / 60);
  const rd = +B().round || 0;
  return rd > 0 ? Math.ceil(c / rd - 1e-9) * rd : r2(c);
}
const sessionTotalMin = (t, now = Date.now()) => t.session ? sessionMin(t.session, now) + (t.session.carryMin || 0) : 0;
function tableStatus(t, now = Date.now()) {
  const s = t.session;
  if (!s) return t.resa ? 'resa' : 'free';
  if (s.pausedAt) return 'pause';
  const m = sessionTotalMin(t, now);
  if ((s.planned && m > s.planned) || m > S.settings.alertTableMin) return 'over';
  return 'run';
}
const ST_LABEL = { free: 'Libre', run: 'En jeu', pause: 'En pause', over: 'Dépassement', resa: 'Réservée' };
const ST_CHIP = { free: '', run: 'green', pause: 'warn', over: 'crit', resa: 'brass' };

/* --------------------------- Lieux & notes --------------------------- */
function locations() {
  const l = [{ id: 'CPT', name: 'Comptoir', type: 'cpt' }];
  for (let i = 1; i <= S.settings.salleCount; i++) l.push({ id: 'S' + i, name: 'Salle ' + i, short: 'S' + i, type: 'salle' });
  S.tables.forEach(t => l.push({ id: t.id, name: t.name, short: t.name.replace('Royale ', 'R'), type: 'billard' }));
  return l;
}
const locName = id => (locations().find(l => l.id === id) || { name: id }).name;
const tabOf = id => S.tabs[id] || null;
const tabItemsTotal = id => (tabOf(id)?.items || []).reduce((a, i) => a + i.price * i.qty, 0);
function locTotal(id, now = Date.now()) { const t = tableById(id); return tabItemsTotal(id) + (t && t.session ? sessionCost(t, now) : 0); }
function reservedQty(pid) { let q = 0; Object.values(S.tabs).forEach(t => t.items.forEach(i => { if (i.pid === pid) q += i.qty; })); return q; }
const prod = id => S.products.find(p => p.id === id);
const catName = id => id === 'billard' ? 'Billard' : (S.cats.find(c => c.id === id)?.name || id);

/* ------------------------------ Totaux ------------------------------ */
function salesOfDay() {
  if (S.day) return S.sales.filter(s => s.dayId === S.day.id);
  const k = dayKey(Date.now()); return S.sales.filter(s => dayKey(s.at) === k);
}
function totals(sales) {
  const T = { ca: 0, billard: 0, cafe: 0, n: 0, disc: 0, voids: 0, voidAmt: 0, byMethod: {}, byCat: {}, byProd: {}, byEmp: {}, byTable: {}, byHour: {}, byDay: {}, billMin: 0 };
  sales.forEach(s => {
    if (s.void) { T.voids++; T.voidAmt += s.total; return; }
    T.n++; T.ca += s.total; T.disc += s.discount || 0;
    T.byMethod[s.method] = (T.byMethod[s.method] || 0) + s.total;
    T.byEmp[s.byName] = (T.byEmp[s.byName] || 0) + s.total;
    const h = new Date(s.at).getHours(); T.byHour[h] = (T.byHour[h] || 0) + s.total;
    const k = dayKey(s.at); T.byDay[k] = (T.byDay[k] || 0) + s.total;
    const ratio = s.subtotal > 0 ? s.total / s.subtotal : 0;
    s.lines.forEach(l => {
      const v = l.price * l.qty * ratio;
      if (l.kind === 'billard') {
        T.billard += v; T.billMin += l.minutes || 0;
        const tb = T.byTable[l.tableName] || (T.byTable[l.tableName] = { v: 0, min: 0, n: 0 });
        tb.v += v; tb.min += l.minutes || 0; tb.n++;
      } else {
        T.cafe += v;
        const p = T.byProd[l.name] || (T.byProd[l.name] = { v: 0, q: 0 }); p.v += v; p.q += l.qty;
      }
      const c = l.kind === 'billard' ? 'billard' : l.cat; T.byCat[c] = (T.byCat[c] || 0) + v;
    });
  });
  T.avg = T.n ? T.ca / T.n : 0;
  return T;
}
function shiftCash(sh) {
  const sales = S.sales.filter(s => s.shiftId === sh.id && !s.void);
  const cash = sales.filter(s => s.method === 'especes').reduce((a, s) => a + s.total, 0);
  const card = sales.filter(s => s.method === 'carte').reduce((a, s) => a + s.total, 0);
  const moves = S.moves.filter(m => m.shiftId === sh.id);
  const mIn = moves.filter(m => m.type === 'in').reduce((a, m) => a + m.amount, 0);
  const mOut = moves.filter(m => m.type === 'out').reduce((a, m) => a + m.amount, 0);
  return { n: sales.length, cash, card, ca: cash + card, mIn, mOut, expected: (sh.float || 0) + cash + mIn - mOut };
}

/* ------------------------------ Alertes ------------------------------ */
function computeAlerts() {
  const A = [], now = Date.now(), st = S.settings;
  if (S.day && dayKey(S.day.openedAt) !== dayKey(now) && now - S.day.openedAt > 20 * 3600000)
    A.push({ lvl: 'crit', t: `Journée du ${ddmmyy(S.day.openedAt)} non clôturée`, s: 'Clôturez-la dans Caisse & shifts.', go: 'caisse' });
  if (!S.day) A.push({ lvl: 'warn', t: 'Journée fermée', s: 'Aucune vente possible tant que la journée n’est pas ouverte.', go: 'caisse' });
  else if (!S.shift) A.push({ lvl: 'warn', t: 'Aucun shift ouvert', s: 'Ouvrez un shift avec son responsable et le fond de caisse.', go: 'caisse' });
  if (S.shift && now - S.shift.openedAt > 10 * 3600000)
    A.push({ lvl: 'warn', t: `Shift #${S.shift.no} ouvert depuis ${durShort((now - S.shift.openedAt) / 60000)}`, s: 'Pensez à passer la main et clôturer.', go: 'caisse' });
  S.tables.forEach(t => {
    const s = t.session;
    if (s) {
      const m = sessionTotalMin(t, now);
      if (s.pausedAt && (now - s.pausedAt) / 60000 > st.alertPauseMin)
        A.push({ lvl: 'warn', t: `${t.name} en pause depuis ${durShort((now - s.pausedAt) / 60000)}`, s: 'Reprendre ou encaisser la partie.', go: 'billard' });
      else if (s.planned && m > s.planned)
        A.push({ lvl: 'crit', t: `${t.name} : temps prévu dépassé`, s: `Prévu ${durShort(s.planned)} · joué ${durShort(m)} · ${dh(sessionCost(t, now))}`, go: 'billard' });
      else if (m > st.alertTableMin)
        A.push({ lvl: 'warn', t: `${t.name} en jeu depuis ${durShort(m)}`, s: `Montant en cours ${dh(locTotal(t.id, now))}`, go: 'billard' });
    } else if (t.resa) {
      const [h, mi] = String(t.resa.time || '').split(':').map(Number);
      if (!isNaN(h)) {
        const d = new Date(); d.setHours(h, mi || 0, 0, 0); const diff = (d.getTime() - now) / 60000;
        if (diff <= 15 && diff >= -30) A.push({ lvl: diff < 0 ? 'warn' : 'info', t: `Réservation ${t.name} à ${t.resa.time}`, s: `${t.resa.name}${diff < 0 ? ' · en retard' : ' · dans ' + Math.round(diff) + ' min'}`, go: 'billard' });
      }
    }
  });
  Object.entries(S.tabs).forEach(([id, tb]) => {
    if (!tb.items.length || tableById(id)) return;
    const m = (now - tb.openedAt) / 60000;
    if (m > st.alertTabMin) A.push({ lvl: 'warn', t: `${locName(id)} : note ouverte depuis ${durShort(m)}`, s: `${dh(tabItemsTotal(id))} non encaissés`, go: 'pos', loc: id });
  });
  S.products.filter(p => p.active && p.track).forEach(p => {
    const avail = p.stock - reservedQty(p.id);
    if (avail <= 0) A.push({ lvl: 'crit', t: `Rupture : ${p.name}`, s: `Stock ${p.stock} · seuil ${p.low}`, go: 'stock' });
    else if (avail <= p.low) A.push({ lvl: 'warn', t: `Stock bas : ${p.name}`, s: `Reste ${avail} · seuil ${p.low}`, go: 'stock' });
  });
  const last = S.shifts[S.shifts.length - 1];
  if (last && S.day && last.dayId === S.day.id && Math.abs(last.diff) >= 20)
    A.push({ lvl: last.diff < 0 ? 'crit' : 'warn', t: `Écart de caisse shift #${last.no} : ${last.diff > 0 ? '+' : ''}${dh(last.diff)}`, s: `Responsable ${last.respName}`, go: 'caisse' });
  const order = { crit: 0, warn: 1, info: 2 };
  return A.sort((a, b) => order[a.lvl] - order[b.lvl]);
}

/* ============================== RENDU ============================== */
const TABS = [
  { id: 'dash', label: 'Tableau de bord' }, { id: 'billard', label: 'Billard' }, { id: 'pos', label: 'Commandes' },
  { id: 'tickets', label: 'Tickets' }, { id: 'stock', label: 'Stock' }, { id: 'caisse', label: 'Caisse & shifts' },
  { id: 'rapports', label: 'Rapports', mgr: true }, { id: 'equipe', label: 'Équipe' }, { id: 'reglages', label: 'Réglages', mgr: true },
];

function renderTop() {
  const pill = $('#status-pill'), txt = $('#status-txt');
  if (!S.day) { pill.className = 'pill off'; txt.textContent = 'Journée fermée'; }
  else if (!S.shift) { pill.className = 'pill half'; txt.textContent = `Journée ${ddmmyy(S.day.openedAt)} · aucun shift`; }
  else { pill.className = 'pill on'; txt.textContent = `Journée ouverte · Shift #${S.shift.no} · Resp. ${emp(S.shift.resp)?.name || '—'}`; }
  const sel = $('#device-user'), cur = S.deviceUser;
  sel.innerHTML = '<option value="">— Choisir l’employé —</option>' + S.employees.filter(e => e.active)
    .map(e => `<option value="${e.id}" ${e.id === cur ? 'selected' : ''}>${esc(e.name)} · ${esc(e.role)}</option>`).join('');
  const lk = $('#lock'); lk.innerHTML = isMgr() ? IC.unlock : IC.lock; lk.classList.toggle('mgr', isMgr());
  lk.title = isMgr() ? 'Mode gérant actif — cliquer pour verrouiller' : 'Déverrouiller le mode gérant';
  renderBell();
}
function renderBell() {
  const A = computeAlerts(), n = A.filter(a => a.lvl !== 'info').length, b = $('#bell-count');
  b.hidden = !n; b.textContent = n; b.classList.toggle('warn', !A.some(a => a.lvl === 'crit'));
  const p = $('#bell-panel'); p.hidden = !ui.bell;
  if (ui.bell) p.innerHTML = `<h4>Alertes · ${A.length}</h4>` + (A.length ? A.map(alertHTML).join('') : '<p class="empty">Tout est en ordre ✓</p>');
  return A;
}
const alertHTML = (a) => `<div class="alert-item ${a.lvl}" data-act="goAlert" data-go="${a.go || ''}" data-loc="${a.loc || ''}"><span class="ai"></span><div>${esc(a.t)}<small>${esc(a.s || '')}</small></div></div>`;

function renderTabs() {
  const busy = S.tables.filter(t => t.session).length;
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab ${ui.tab === t.id ? 'active' : ''}" data-act="tab" data-tab="${t.id}">${t.label}${t.id === 'billard' && busy ? ` <span class="cnt">${busy}</span>` : ''}${t.mgr && !isMgr() ? `<span class="lk">${IC.lock}</span>` : ''}</button>`).join('');
}

function render() {
  if (TABS.find(t => t.id === ui.tab)?.mgr && !isMgr()) ui.tab = 'dash';
  renderTop(); renderTabs();
  $('#view').innerHTML = (VIEWS[ui.tab] || VIEWS.dash)();
  tick();
}

/* ---------------------------- Tableau de bord ---------------------------- */
function kpi(l, v, s = '', cls = '') { return `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`; }
const kv = n => `${Math.round(n).toLocaleString('fr-FR').replace(/[  ]/g, ' ')}<small>DH</small>`;

function miniTable(t) {
  const st = tableStatus(t);
  return `<div class="mt ${st}" data-act="tab" data-tab="billard"><div class="n">${esc(t.name)} <span class="chip ${ST_CHIP[st]}">${ST_LABEL[st]}</span></div>
    <div class="tm" data-timer="${t.id}">${t.session ? dur(sessionTotalMin(t) * 60000) : '00:00:00'}</div>
    <div class="c" data-cost="${t.id}">${t.session ? dh(locTotal(t.id)) : (t.resa ? 'Résa ' + esc(t.resa.time) : '—')}</div></div>`;
}

const VIEWS = {};
VIEWS.dash = () => {
  const T = totals(salesOfDay()), busy = S.tables.filter(t => t.session).length, A = computeAlerts();
  const shc = S.shift ? shiftCash(S.shift) : null;
  const openTabs = Object.entries(S.tabs).filter(([id, t]) => t.items.length || tableById(id)?.session);
  const running = S.tables.reduce((a, t) => a + locTotal(t.id), 0) + Object.keys(S.tabs).filter(id => !tableById(id)).reduce((a, id) => a + tabItemsTotal(id), 0);
  const top = Object.entries(T.byProd).sort((a, b) => b[1].q - a[1].q).slice(0, 6);
  const recent = salesOfDay().slice(-6).reverse();
  return `
  <div class="page-head"><div><h1>Tableau de bord</h1><p>${S.day ? `Journée ouverte le ${ddmmyy(S.day.openedAt)} à ${hhmm(S.day.openedAt)} par ${esc(S.day.openedByName)}` : 'Journée fermée — les chiffres affichés sont ceux d’aujourd’hui.'}</p></div>
    <div class="row"><button class="btn" data-act="tab" data-tab="billard">${IC.play} Lancer une table</button><button class="btn primary" data-act="tab" data-tab="pos">${IC.plus} Nouvelle commande</button></div></div>
  <div class="kpis">
    ${kpi('Chiffre d’affaires', kv(T.ca), `${T.n} ticket${T.n > 1 ? 's' : ''} · panier moyen ${dh0(T.avg)}`, 'accent')}
    ${kpi('Billard', kv(T.billard), `${durShort(T.billMin)} facturées`)}
    ${kpi('Café & snacks', kv(T.cafe), T.disc ? `Remises ${dh0(T.disc)}` : 'Aucune remise')}
    ${kpi('En cours (non encaissé)', kv(running), `${openTabs.length} note${openTabs.length > 1 ? 's' : ''} ouverte${openTabs.length > 1 ? 's' : ''}`, 'brass')}
    ${kpi('Tables occupées', `${busy}<small>/ ${S.tables.length}</small>`, `${S.tables.filter(t => tableStatus(t) === 'pause').length} en pause`)}
    ${kpi('Espèces attendues', shc ? kv(shc.expected) : '—', shc ? `Fond ${dh0(S.shift.float)} · carte ${dh0(shc.card)}` : 'Aucun shift ouvert')}
  </div>
  <div class="grid g2">
    <div class="card"><h3>Tables royales en direct <button class="btn sm ghost" data-act="tab" data-tab="billard">Tout voir →</button></h3><div class="mini-tables">${S.tables.map(miniTable).join('')}</div></div>
    <div class="card"><h3>Alertes <span class="chip ${A.some(a => a.lvl === 'crit') ? 'crit' : A.length ? 'warn' : 'ok'}">${A.length}</span></h3>${A.length ? A.slice(0, 6).map(alertHTML).join('') : '<p class="empty">Aucune alerte ✓</p>'}</div>
    <div class="card"><h3>Meilleures ventes du jour</h3>${top.length ? bars(top.map(([n, v]) => ({ l: n, v: v.q })), { fmt: v => v + ' u.' }) : '<p class="empty">Pas encore de vente.</p>'}</div>
    <div class="card"><h3>Derniers tickets <button class="btn sm ghost" data-act="tab" data-tab="tickets">Historique →</button></h3>
      ${recent.length ? `<table class="t"><tbody>${recent.map(s => `<tr class="${s.void ? 'void' : ''}"><td class="num">#${pad(s.no, 5)}</td><td>${hhmm(s.at)}</td><td>${esc(s.locName)}</td><td class="muted">${esc(s.byName)}</td><td class="r num">${dh(s.total)}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">Aucun ticket.</p>'}
    </div>
  </div>`;
};

/* -------------------------------- Billard -------------------------------- */
function tableCard(t) {
  const st = tableStatus(t), s = t.session, items = tabOf(t.id)?.items || [];
  const nItems = items.reduce((a, i) => a + i.qty, 0);
  let meta = '';
  if (s) meta = [s.client, s.players ? s.players + ' joueurs' : '', s.planned ? 'prévu ' + durShort(s.planned) : 'temps libre', 'depuis ' + hhmm(s.firstStart || s.start)].filter(Boolean).map(esc).join(' · ');
  else if (t.resa) meta = `Réservée à ${esc(t.resa.time)} · ${esc(t.resa.name)}`;
  let actions;
  if (!s) actions = `<button class="btn primary wide" data-act="startTable" data-id="${t.id}">${IC.play} Démarrer la partie</button>
      <button class="btn sm" data-act="resaTable" data-id="${t.id}">${t.resa ? 'Modifier résa' : 'Réserver'}</button>
      ${t.resa ? `<button class="btn sm danger" data-act="cancelResa" data-id="${t.id}">Annuler résa</button>` : `<button class="btn sm" data-act="posAt" data-loc="${t.id}" disabled title="Démarrez d’abord la partie">${IC.plus} Conso</button>`}`;
  else actions = `
      ${s.pausedAt ? `<button class="btn" data-act="resumeTable" data-id="${t.id}">${IC.play} Reprendre</button>` : `<button class="btn" data-act="pauseTable" data-id="${t.id}">${IC.pause} Pause</button>`}
      <button class="btn" data-act="posAt" data-loc="${t.id}">${IC.plus} Conso</button>
      <button class="btn sm" data-act="transferTable" data-id="${t.id}">${IC.swap} Changer de table</button>
      <button class="btn sm danger" data-act="cancelTable" data-id="${t.id}">Annuler</button>
      <button class="btn brass wide" data-act="pay" data-loc="${t.id}">${IC.cash} Arrêter & encaisser</button>`;
  return `<div class="bt st-${st}">
    <div class="bt-head"><div><div class="bt-name">${esc(t.name)}</div><div class="bt-rate">${dh0(t.rate)} / heure</div></div><span class="chip ${ST_CHIP[st]}">${ST_LABEL[st]}</span></div>
    <div class="felt"><i class="pk a"></i><i class="pk b"></i><i class="pk c"></i><i class="pk d"></i><i class="pk e"></i><i class="pk f"></i>
      <div class="timer" data-timer="${t.id}">${s ? dur(sessionTotalMin(t) * 60000) : '00:00:00'}</div>
      <div class="cost" data-bcost="${t.id}">${s ? dh(sessionCost(t)) : '—'}</div>
      <div class="meta">${meta || 'Table disponible'}</div></div>
    <div class="bt-foot"><span>Consos : ${nItems ? `${nItems} art. · ${dh(tabItemsTotal(t.id))}` : 'aucune'}</span><span>Total <b class="num brass" data-cost="${t.id}" style="font-size:17px">${s ? dh(locTotal(t.id)) : '—'}</b></span></div>
    <div class="bt-actions">${actions}</div></div>`;
}
VIEWS.billard = () => {
  const T = totals(salesOfDay()), busy = S.tables.filter(t => t.session);
  return `<div class="page-head"><div><h1>Salle de billard</h1><p>${busy.length} table${busy.length > 1 ? 's' : ''} en jeu sur ${S.tables.length} · Facturation par tranche de ${B().block} min, minimum ${B().min} min</p></div>
    <div class="row"><span class="chip green">Billard aujourd’hui : ${dh0(T.billard)}</span><span class="chip">En cours : ${dh0(busy.reduce((a, t) => a + sessionCost(t), 0))}</span></div></div>
    <div class="bt-grid">${S.tables.map(tableCard).join('')}</div>`;
};

/* ------------------------------- Commandes ------------------------------- */
function posGrid() {
  const q = ui.posSearch.trim().toLowerCase();
  const list = S.products.filter(p => p.active && (ui.posCat === 'all' || p.cat === ui.posCat) && (!q || p.name.toLowerCase().includes(q)));
  if (!list.length) return '<p class="empty">Aucun produit.</p>';
  return list.map(p => {
    let badge = '', out = false;
    if (p.track) { const a = p.stock - reservedQty(p.id); out = a <= 0; badge = `<span class="ps ${out ? 'out' : a <= p.low ? 'low' : ''}">${out ? 'Rupture' : a}</span>`; }
    return `<button class="prod ${out ? 'out' : ''}" data-act="addItem" data-pid="${p.id}">${badge}<span class="pn">${esc(p.name)}</span><span class="pp">${num(p.price).replace(',00', '')} <small>DH</small></span></button>`;
  }).join('');
}
function cartHTML() {
  const loc = ui.posLoc, tb = tabOf(loc), t = tableById(loc), items = tb?.items || [];
  const bill = t && t.session ? `<div class="cl bill"><div class="nm">Billard · ${esc(t.name)}<small data-timer="${t.id}">${dur(sessionTotalMin(t) * 60000)}</small></div><span></span><div class="tt" data-bcost="${t.id}">${dh(sessionCost(t))}</div></div>` : '';

      <div class="qty"><button data-act="qty" data-idx="${idx}" data-d="-1" aria-label="Moins">−</button><span>${i.qty}</span><button data-act="qty" data-idx="${idx}" data-d="1" aria-label="Plus">+</button></div>
      <div class="tt">${num(i.price * i.qty)}</div></div>`).join('');
  const total = locTotal(loc);
  return `<div class="card cart">
    <div class="cart-head"><div><div class="muted" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Note en cours</div><div class="ln">${esc(locName(loc))}</div>
      <div class="muted" style="font-size:12px;margin-top:4px">${tb ? `Ouverte à ${hhmm(tb.openedAt)} par ${esc(tb.byName || '—')}` : 'Aucun article'}</div></div>
      ${items.length && !t ? `<button class="btn sm" data-act="moveTab">${IC.swap} Déplacer</button>` : ''}</div>

    <div class="grid" style="grid-template-columns:1fr 2fr;gap:8px">
      <button class="btn danger" data-act="clearTab" ${items.length ? '' : 'disabled'}>Vider</button>
      <button class="btn primary lg" data-act="pay" data-loc="${loc}" ${total > 0 ? '' : 'disabled'}>${IC.cash} Encaisser</button>
    </div></div>`;
}
function posLocsHTML() {

      <div class="loc-group"><h5>Tables billard</h5><div class="loc-list two">${locs.filter(l => l.type === 'billard').map(locBtn).join('')}</div></div>

}
VIEWS.pos = () => {
  const lt = tableById(ui.posLoc);

  return `<div class="pos">
    ${posLocsHTML()}

      <div class="row" style="margin-bottom:12px"><input id="pos-search" class="in" style="max-width:320px" placeholder="Rechercher un produit…" value="${esc(ui.posSearch)}" autocomplete="off"></div>
      <div class="cats"><button class="cat ${ui.posCat === 'all' ? 'on' : ''}" data-act="posCat" data-cat="all">Tout</button>${S.cats.map(c => `<button class="cat ${ui.posCat === c.id ? 'on' : ''}" data-act="posCat" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>
      <div id="pos-grid" class="prod-grid">${posGrid()}</div>
    </div>
    <div id="cart-wrap">${cartHTML()}</div>
  </div>`;
};

/* -------------------------------- Tickets -------------------------------- */
function filteredSales() {
  let list = S.sales;
  if (ui.ticketsFilter === 'day') list = salesOfDay();
  else if (ui.ticketsFilter === 'shift') list = S.shift ? S.sales.filter(s => s.shiftId === S.shift.id) : [];
  const q = ui.ticketsSearch.trim().toLowerCase();
  if (q) list = list.filter(s => String(s.no).includes(q) || s.locName.toLowerCase().includes(q) || s.byName.toLowerCase().includes(q));
  return list.slice().reverse();
}
VIEWS.tickets = () => {
  const list = filteredSales(), T = totals(list);
  const shown = list.slice(0, 300);
  return `<div class="page-head"><div><h1>Tickets</h1><p>${T.n} ticket${T.n > 1 ? 's' : ''} · ${dh(T.ca)}${T.voids ? ` · ${T.voids} annulé${T.voids > 1 ? 's' : ''} (${dh(T.voidAmt)})` : ''}</p></div>
    <div class="row"><div class="seg">${[['shift', 'Shift en cours'], ['day', 'Journée'], ['all', 'Tout']].map(([k, l]) => `<button class="${ui.ticketsFilter === k ? 'on' : ''}" data-act="tFilter" data-f="${k}">${l}</button>`).join('')}</div>
    <input id="t-search" class="in" style="width:200px" placeholder="N°, table, employé…" value="${esc(ui.ticketsSearch)}"></div></div>
    <div class="card tscroll">${shown.length ? `<table class="t"><thead><tr><th>N°</th><th>Date</th><th>Lieu</th><th>Employé</th><th>Articles</th><th>Paiement</th><th class="r">Total</th><th></th></tr></thead><tbody>
    ${shown.map(s => `<tr class="${s.void ? 'void' : ''}"><td class="num" style="font-size:17px">#${pad(s.no, 5)}</td><td>${ddmmyy(s.at)} <span class="muted">${hhmm(s.at)}</span></td><td>${esc(s.locName)}</td><td>${esc(s.byName)}</td>
      <td class="muted">${s.lines.reduce((a, l) => a + l.qty, 0)} art.${s.lines.some(l => l.kind === 'billard') ? ' · billard' : ''}</td>
      <td><span class="chip ${s.method === 'carte' ? 'green' : s.method === 'offert' ? 'brass' : ''}">${METHODS[s.method]}</span>${s.discount ? ` <span class="chip warn">−${dh0(s.discount)}</span>` : ''}</td>
      <td class="r num" style="font-size:18px">${dh(s.total)}</td>
      <td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm" data-act="viewTicket" data-id="${s.id}">Voir</button>${s.void ? '<span class="chip crit">Annulé</span>' : `<button class="btn sm danger" data-act="voidTicket" data-id="${s.id}">Annuler</button>`}</div></td></tr>`).join('')}
    </tbody></table>${list.length > 300 ? `<p class="empty">… ${list.length - 300} tickets plus anciens non affichés.</p>` : ''}` : '<p class="empty">Aucun ticket pour cette période.</p>'}</div>`;
};

/* --------------------------------- Stock --------------------------------- */
VIEWS.stock = () => {
  const q = ui.stockSearch.trim().toLowerCase();
  const list = S.products.filter(p => (ui.stockCat === 'all' || p.cat === ui.stockCat) && (!q || p.name.toLowerCase().includes(q)));
  const tracked = S.products.filter(p => p.track && p.active);
  const outN = tracked.filter(p => p.stock <= 0).length, lowN = tracked.filter(p => p.stock > 0 && p.stock <= p.low).length;
  const value = tracked.reduce((a, p) => a + Math.max(0, p.stock) * (p.cost || 0), 0);
  const mv = S.stockLog.slice(-12).reverse();
  return `<div class="page-head"><div><h1>Stock & carte</h1><p>${tracked.length} articles suivis · <span class="crit">${outN} en rupture</span> · <span class="warn">${lowN} stock bas</span>${value ? ` · valeur ${dh0(value)}` : ''}</p></div>
    <div class="row"><button class="btn" data-act="restockMulti">${IC.plus} Réception marchandise</button><button class="btn primary" data-act="editProduct">${IC.plus} Nouveau produit</button></div></div>
    <div class="row" style="margin-bottom:12px"><input id="s-search" class="in" style="max-width:260px" placeholder="Rechercher…" value="${esc(ui.stockSearch)}">
      <div class="cats" style="margin:0"><button class="cat ${ui.stockCat === 'all' ? 'on' : ''}" data-act="stockCat" data-cat="all">Tout</button>${S.cats.map(c => `<button class="cat ${ui.stockCat === c.id ? 'on' : ''}" data-act="stockCat" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div></div>
    <div class="grid" style="grid-template-columns:minmax(0,1fr) 320px;align-items:start" id="stock-layout">
      <div class="card tscroll"><table class="t"><thead><tr><th>Produit</th><th>Catégorie</th><th class="r">Prix</th><th class="r">Stock</th><th class="r">Seuil</th><th>État</th><th></th></tr></thead><tbody>
      ${list.map(p => {
        const a = p.stock - reservedQty(p.id);

          <td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">${p.track ? `<button class="btn sm" data-act="restock" data-id="${p.id}">+ Entrée</button>` : ''}<button class="btn sm ghost" data-act="editProduct" data-id="${p.id}">Modifier</button></div></td></tr>`;
      }).join('') || '<tr><td colspan="7" class="empty">Aucun produit.</td></tr>'}
      </tbody></table></div>
      <div class="card"><h3>Mouvements récents</h3>${mv.length ? mv.map(m => `<div class="list-item" style="padding:8px 4px"><div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(prod(m.pid)?.name || '?')}</div><div class="muted" style="font-size:12px">${esc(m.reason)} · ${esc(m.by)} · ${ddmmyy(m.at)} ${hhmm(m.at)}</div></div><span class="num ${m.delta > 0 ? 'ok' : 'crit'}" style="font-size:18px">${m.delta > 0 ? '+' : ''}${m.delta}</span></div>`).join('') : '<p class="empty">Aucun mouvement.</p>'}</div>
    </div>`;
};

/* ---------------------------- Caisse & shifts ---------------------------- */

  const day = S.day, sh = S.shift, c = sh ? shiftCash(sh) : null;
  const dayT = totals(salesOfDay());
  const moves = sh ? S.moves.filter(m => m.shiftId === sh.id).slice().reverse() : [];

  return `<div class="page-head"><div><h1>Caisse & shifts</h1><p>Ouverture / clôture de la journée, passation des shifts et contrôle du tiroir-caisse.</p></div></div>

function bars(rows, { fmt = dh0 } = {}) {
  if (!rows.length) return '<p class="empty">Aucune donnée.</p>';
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars">${rows.map(r => `<div class="bar-row"><span class="bar-l" title="${esc(r.l)}">${esc(r.l)}</span><span class="bar-t"><i style="width:${(r.v / max * 100).toFixed(1)}%"></i></span><span class="bar-v">${fmt(r.v)}</span></div>`).join('')}</div>`;
}
function cols(rows) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="cols">${rows.map(r => `<div class="c" title="${esc(r.l)} : ${dh0(r.v)}"><b>${r.v ? Math.round(r.v) : ''}</b><i style="height:${(r.v / max * 100).toFixed(1)}%"></i><span>${esc(r.l)}</span></div>`).join('')}</div>`;
}
function rangeSales() {
  const now = Date.now(), r = ui.reportRange;
  if (r === 'today') return { sales: salesOfDay(), label: 'Journée en cours', days: 1 };
  const n = r === '7' ? 7 : r === '30' ? 30 : 90;
  const from = startOfDay(now) - (n - 1) * DAY_MS;
  return { sales: S.sales.filter(s => s.at >= from), label: `${n} derniers jours`, days: n, from };
}

  const hours = []; for (let h = 9; h <= 23; h++) hours.push({ l: h + 'h', v: T.byHour[h] || 0 });
  [0, 1, 2, 3].forEach(h => { if (T.byHour[h]) hours.push({ l: h + 'h', v: T.byHour[h] }); });
  const tableRows = Object.entries(T.byTable).sort((a, b) => b[1].v - a[1].v);

    <div class="card tscroll"><h3>Tables de billard</h3>${tableRows.length ? `<table class="t"><thead><tr><th>Table</th><th class="r">Parties</th><th class="r">Temps</th><th class="r">CA</th><th class="r">DH/h réel</th></tr></thead><tbody>${tableRows.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="r">${v.n}</td><td class="r">${durShort(v.min)}</td><td class="r num" style="font-size:17px">${dh0(v.v)}</td><td class="r muted">${v.min ? dh0(v.v / v.min * 60) : '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">Aucune partie.</p>'}</div>
    <div class="card"><h3>Par employé</h3>${bars(empRows)}</div>
    <div class="card"><h3>Top 10 produits</h3>${topRows.length ? `<table class="t"><tbody>${topRows.map(([n, v], i) => `<tr><td class="muted">${i + 1}</td><td>${esc(n)}</td><td class="r muted">${v.q} u.</td><td class="r num" style="font-size:17px">${dh0(v.v)}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">Aucune vente.</p>'}</div>

function exampleCost(min, rate) { return sessionCost({ rate, session: { start: 0, pausedMs: 0, pausedAt: min * 60000 } }); }

/* ============================ Timers / tick ============================ */
function tick() {
  const now = Date.now(), d = new Date(now);
  $('#clock').innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}<span style="opacity:.5">:${pad(d.getSeconds())}</span><small>${WD[d.getDay()]} ${ddmmyy(now)}</small>`;
  S.tables.forEach(t => {
    if (!t.session) return;
    $$(`[data-timer="${t.id}"]`).forEach(el => el.textContent = dur(sessionTotalMin(t, now) * 60000));
    $$(`[data-bcost="${t.id}"]`).forEach(el => el.textContent = dh(sessionCost(t, now)));
    $$(`[data-cost="${t.id}"]`).forEach(el => {
      const v = locTotal(t.id, now);
      if (el.classList.contains('amt')) el.textContent = Math.round(v);
      else if (el.classList.contains('v')) el.innerHTML = `${num(v)} <small>DH</small>`;
      else el.textContent = dh(v);
    });
  });
  if (ui.manager && now >= ui.managerUntil) { ui.manager = false; toast('Mode gérant verrouillé automatiquement.'); render(); }
}
let slowTick = 0;
setInterval(() => {
  tick();
  if (++slowTick % 20 === 0) {
    renderBell();
    const busyUI = ui.modal || ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);
    if (!busyUI && ['dash', 'billard'].includes(ui.tab)) { $('#view').innerHTML = VIEWS[ui.tab](); renderTabs(); tick(); }
  }
}, 1000);

/* ============================ Modales & toasts ============================ */
function toast(msg, lvl = '') {
  const el = document.createElement('div'); el.className = 'toast ' + lvl; el.textContent = msg;
  const box = $('#toasts'); box.appendChild(el); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => el.remove(), lvl ? 4200 : 2600);
}
function modal({ title, body, foot = '', wide = false, ok = null, onMount = null }) {
  ui.modal = { ok };
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="m-head"><h3>${title}</h3><button class="icon-btn sm" data-act="closeModal" aria-label="Fermer">×</button></div>
    <div class="m-body">${body}</div>${foot ? `<div class="m-foot">${foot}</div>` : ''}</div></div>`;
  const m = $('#modal-root .modal');
  if (onMount) onMount(m);
  const f = m.querySelector('[autofocus]') || m.querySelector('input:not([type=checkbox]):not([type=radio]),select,textarea');
  if (f) setTimeout(() => f.focus(), 30);
  return m;
}
function closeModal() { $('#modal-root').innerHTML = ''; ui.modal = null; }
const mval = sel => $('#modal-root ' + sel)?.value ?? '';
function confirmBox(title, text, okLabel, fn, danger = false) {
  modal({ title, body: `<p style="margin:0;line-height:1.5">${text}</p>`, foot: `<button class="btn" data-act="closeModal">Retour</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="modalOk">${okLabel}</button>`, ok: () => { closeModal(); fn(); } });
}

function openPin(then) {
  let code = '';
  const hint = S.settings.managerPin === '1234' ? '<p class="muted" style="text-align:center;font-size:12px;margin:12px 0 0">PIN par défaut : 1234 — à changer dans Réglages.</p>' : '';
  const m = modal({
    title: 'Mode gérant', body: `<p class="muted" style="text-align:center;margin-top:0">Saisissez le code PIN gérant</p><div class="pin-dots" id="pin-dots"></div>
      <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, 'OK'].map(k => `<button data-pin="${k}" ${k === 'OK' ? 'style="color:var(--brass)"' : ''}>${k === 'C' ? '⌫' : k}</button>`).join('')}</div>${hint}`,
  });
  const draw = () => { $('#pin-dots').innerHTML = Array.from({ length: Math.max(4, code.length) }, (_, i) => `<i class="${i < code.length ? 'f' : ''}"></i>`).join(''); };
  const submit = () => {
    if (code === String(S.settings.managerPin)) {
      ui.manager = true; ui.managerUntil = Date.now() + 10 * 60000; closeModal(); log('Mode gérant déverrouillé'); save();
      toast('Mode gérant actif (10 min).'); render(); if (then) then();
    } else { code = ''; draw(); m.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 220 }); toast('Code incorrect', 'crit'); }
  };
  const press = k => { if (k === 'OK') return submit(); if (k === 'C') code = code.slice(0, -1); else if (code.length < 8) code += k; draw(); if (code.length >= 4 && code === String(S.settings.managerPin)) submit(); };
  m.addEventListener('click', e => { const b = e.target.closest('[data-pin]'); if (b) press(b.dataset.pin); });
  ui.modal.key = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('C'); else if (e.key === 'Enter') press('OK'); };
  draw();
}

};

A.pay = el => {
  const u = canSell(); if (!u) return;

  const lines = [];
  if (t && t.session) {
    const min = sessionTotalMin(t, now);
    lines.push({ kind: 'billard', name: `Billard ${t.name}`, from: t.session.from || '', qty: 1, price: sessionCost(t, now), minutes: Math.round(min), tableId: t.id, tableName: t.name, cat: 'billard' });
  }
  items.forEach(i => lines.push({ kind: 'produit', pid: i.pid, name: i.name, cat: i.cat, qty: i.qty, price: i.price }));
  if (!lines.length) return toast('Rien à encaisser.', 'warn');
  const sub = r2(lines.reduce((a, l) => a + l.price * l.qty, 0));
  const pc = { method: 'especes', discPct: 0, discAmt: 0 };
  const total = () => pc.method === 'offert' ? 0 : r2(Math.max(0, sub - pc.discAmt - sub * pc.discPct / 100));
  const quick = [...new Set([Math.ceil(sub / 10) * 10, Math.ceil(sub / 50) * 50, Math.ceil(sub / 100) * 100, Math.ceil(sub / 200) * 200])].filter(v => v >= sub).slice(0, 4);
  const m = modal({
    title: `Encaisser · ${esc(locName(loc))}`, wide: true,
    body: `<div class="grid g2" style="align-items:start">
      <div><div class="pay-lines">${lines.map(l => `<div><span>${l.qty > 1 ? l.qty + ' × ' : ''}${esc(l.name)}${l.kind === 'billard' ? ` · ${durShort(l.minutes)}` : ''}</span><span>${num(l.price * l.qty)}</span></div>`).join('')}</div>
        <div class="row between" style="margin-top:10px"><span class="muted">Sous-total</span><span class="num" style="font-size:20px">${dh(sub)}</span></div>
        <div class="f" style="margin-top:12px"><span>Remise</span><div class="row" style="flex-wrap:nowrap"><div class="seg" id="pay-pct">${[0, 5, 10, 15, 20].map(p => `<button type="button" class="${p === 0 ? 'on' : ''}" data-v="${p}">${p ? p + ' %' : 'Aucune'}</button>`).join('')}</div>
          <input class="in" id="pay-disc" type="number" min="0" step="0.5" placeholder="DH" style="width:90px"></div></div></div>
      <div><div class="f"><span>Mode de paiement</span><div class="seg" id="pay-method">${Object.entries(METHODS).map(([k, v]) => `<button type="button" class="${k === 'especes' ? 'on' : ''}" data-v="${k}">${v}</button>`).join('')}</div></div>
        <div class="pay-total"><span class="muted">À payer</span><span class="v" id="pay-total">${num(sub)}</span></div>
        <div id="pay-cash"><label class="f"><span>Montant reçu (DH)</span><input class="in big" id="pay-given" type="number" min="0" step="0.5" placeholder="${num(sub)}"></label>
          <div class="quick">${quick.map(q => `<button type="button" data-q="${q}">${q}</button>`).join('')}<button type="button" data-q="exact">Exact</button></div>
          <div class="row between" style="margin-top:12px"><span class="muted">À rendre</span><span class="change" id="pay-change">0,00 DH</span></div></div>
        <label class="check" style="margin-top:14px"><input type="checkbox" id="pay-print" checked> Imprimer le ticket</label></div></div>`,
    foot: `<button class="btn" data-act="closeModal">Annuler</button><button class="btn primary lg" data-act="modalOk">${IC.cash} Valider le paiement</button>`,
    onMount: m => {
      const upd = () => {
        const tot = total(); $('#pay-total').textContent = num(tot);
        $('#pay-cash').style.display = pc.method === 'especes' ? '' : 'none';
        const g = parseFloat($('#pay-given').value), ch = $('#pay-change');
        if (isNaN(g)) { ch.textContent = '0,00 DH'; ch.className = 'change'; }
        else { const d = r2(g - tot); ch.textContent = dh(d); ch.className = 'change ' + (d < 0 ? 'crit' : 'ok'); }
      };
      m.querySelector('#pay-pct').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; pc.discPct = +b.dataset.v; $$('#pay-pct button').forEach(x => x.classList.toggle('on', x === b)); upd(); });
      m.querySelector('#pay-method').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; pc.method = b.dataset.v; $$('#pay-method button').forEach(x => x.classList.toggle('on', x === b)); upd(); });
      m.querySelector('#pay-disc').addEventListener('input', e => { pc.discAmt = Math.max(0, parseFloat(e.target.value) || 0); upd(); });
      m.querySelector('#pay-given').addEventListener('input', upd);
      m.querySelector('.quick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('#pay-given').value = b.dataset.q === 'exact' ? total() : b.dataset.q; upd(); });
    },
    ok: () => {
      const tot = total(), disc = r2(sub - tot), given = parseFloat($('#pay-given').value);
      if (pc.method === 'especes' && !isNaN(given) && given < tot) return toast('Montant reçu insuffisant.', 'crit');
      const pct = sub > 0 ? disc / sub * 100 : 0;
      const finish = () => {
        const cur = S.tabs[loc];
        const sale = {
          id: uid(), no: S.seq.ticket++, at: Date.now(), by: u.id, byName: u.name, dayId: S.day.id, shiftId: S.shift.id,
          loc, locName: locName(loc), lines, subtotal: sub, discount: disc, total: tot, method: pc.method,
          given: pc.method === 'especes' ? (isNaN(given) ? tot : r2(given)) : null, change: pc.method === 'especes' && !isNaN(given) ? r2(given - tot) : 0,
          client: t?.session?.client || '',
        };
        S.sales.push(sale);
        lines.filter(l => l.pid).forEach(l => { const p = prod(l.pid); if (p && p.track) { p.stock -= l.qty; S.stockLog.push({ at: sale.at, pid: p.id, delta: -l.qty, reason: `Vente #${pad(sale.no, 5)}`, by: u.name }); } });
        if (t) { t.session = null; }
        if (cur) delete S.tabs[loc];
        log(`Ticket #${pad(sale.no, 5)} · ${sale.locName} · ${dh(tot)} · ${METHODS[sale.method]}${disc ? ' · remise ' + dh(disc) : ''}`);
        save(); const pr = $('#pay-print').checked; closeModal(); if (ui.posLoc === loc) ui.posLoc = 'CPT';
        toast(`Ticket #${pad(sale.no, 5)} encaissé · ${dh(tot)}${sale.change > 0 ? ' · rendu ' + dh(sale.change) : ''}`); render();
        if (pr) printTicket(sale);
      };
      if ((pc.method === 'offert' || pct > S.settings.staffMaxDiscount + 0.01) && !isMgr()) { toast(pc.method === 'offert' ? 'Offrir une note nécessite le gérant.' : `Remise > ${S.settings.staffMaxDiscount} % : validation gérant requise.`, 'warn'); return openPinKeep(finish); }
      finish();
    },
  });
};
/* PIN par-dessus la modale de paiement (on restaure la modale en cas d’échec) */
function openPinKeep(fn) {
  const holder = document.createElement('div'); holder.id = 'pay-hold'; holder.style.display = 'none';
  const ov = $('#modal-root .overlay'); holder.appendChild(ov); document.body.appendChild(holder);
  const prevModal = ui.modal;
  let cancelObs;
  openPin(() => { cancelObs.disconnect(); const r = $('#modal-root'); r.innerHTML = ''; r.appendChild(ov); holder.remove(); ui.modal = prevModal; fn(); });
  cancelObs = new MutationObserver(() => {
    if (!$('#modal-root').children.length && document.body.contains(holder) && !isMgr()) {
      $('#modal-root').appendChild(ov); holder.remove(); ui.modal = prevModal; cancelObs.disconnect();
    }
  });
  cancelObs.observe($('#modal-root'), { childList: true });
}
