function genDemo() {
  const now = Date.now(), emps = S.employees.filter(e => e.active), prods = S.products.filter(p => p.active);
  const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)];
  for (let d = 14; d >= 1; d--) {
    const base = startOfDay(now - d * DAY_MS), dayId = 'demo' + uid(), wk = [5, 6, 0].includes(new Date(base).getDay());
    const shifts = [{ id: uid(), no: S.seq.shift++, from: 9, to: 16 }, { id: uid(), no: S.seq.shift++, from: 16, to: 24 }];
    const n = (wk ? 55 : 35) + rnd(20); let dayCa = 0;
    const daySales = [];
    for (let i = 0; i < n; i++) {
      const h = Math.random() < .62 ? 16 + rnd(8) : 9 + rnd(7), at = base + h * 3600000 + rnd(3600000);
      const sh = h >= 16 ? shifts[1] : shifts[0], who = pick(emps), lines = [];
      let loc = 'CPT', locN = 'Comptoir';
      if (Math.random() < .45) {
        const t = pick(S.tables), min = 25 + rnd(130);
        lines.push({ kind: 'billard', name: 'Billard ' + t.name, qty: 1, price: exampleCost(min, t.rate), minutes: min, tableId: t.id, tableName: t.name, cat: 'billard' });
        loc = t.id; locN = t.name;
      } else if (Math.random() < .6) { const k = 1 + rnd(S.settings.salleCount); loc = 'S' + k; locN = 'Salle ' + k; }
      const k = 1 + rnd(4); for (let j = 0; j < k; j++) { const p = pick(prods); const ex = lines.find(l => l.pid === p.id); if (ex) ex.qty++; else lines.push({ kind: 'produit', pid: p.id, name: p.name, cat: p.cat, qty: 1 + (Math.random() < .25 ? 1 : 0), price: p.price }); }
      const sub = r2(lines.reduce((a, l) => a + l.price * l.qty, 0)), disc = Math.random() < .05 ? r2(sub * .1) : 0, tot = r2(sub - disc);
      const method = Math.random() < .78 ? 'especes' : 'carte';
      daySales.push({ id: uid(), no: 0, at, by: who.id, byName: who.name, dayId, shiftId: sh.id, loc, locName: locN, lines, subtotal: sub, discount: disc, total: tot, method, given: null, change: 0, demo: true });
      dayCa += tot;
    }
    daySales.sort((a, b) => a.at - b.at).forEach(s => { s.no = S.seq.ticket++; S.sales.push(s); });
    shifts.forEach(sh => {
      const ss = daySales.filter(s => s.shiftId === sh.id), cash = ss.filter(s => s.method === 'especes').reduce((a, s) => a + s.total, 0), card = ss.reduce((a, s) => a + s.total, 0) - cash;
      const resp = emps.find(e => e.role === (sh.from === 9 ? 'Responsable' : 'Gérant')) || emps[0], diff = [0, 0, 0, -10, 5, -20][rnd(6)];
      S.shifts.push({ id: sh.id, no: sh.no, dayId, resp: resp.id, respName: resp.name, openedAt: base + sh.from * 3600000, closedAt: base + Math.min(sh.to, 23.99) * 3600000, float: 500, expected: r2(500 + cash), counted: r2(500 + cash + diff), diff, ca: r2(cash + card), cash: r2(cash), card: r2(card), mIn: 0, mOut: 0, n: ss.length, closedBy: resp.name, demo: true });
    });
    S.days.push({ id: dayId, openedAt: base + 9 * 3600000, closedAt: base + 23.9 * 3600000, openedByName: 'Démo', ca: r2(dayCa), demo: true });
  }
  S.sales.sort((a, b) => a.at - b.at); S.shifts.sort((a, b) => a.openedAt - b.openedAt);
  log('Historique de démonstration généré (14 jours)'); save(); render(); toast('Historique démo généré — voir Rapports.');
}

/* ============================ Impression ============================ */
const W = 32;
const line = (c = '-') => c.repeat(W);
const center = s => wrapName(s, W).map(x => ' '.repeat(Math.max(0, Math.floor((W - x.length) / 2))) + x).join('\n');
const lr = (l, r) => { l = String(l); r = String(r); const sp = W - l.length - r.length; return sp >= 1 ? l + ' '.repeat(sp) + r : l.slice(0, W - r.length - 1) + ' ' + r; };
function wrapName(n, width) {
  const out = []; let cur = '';
  String(n).split(' ').forEach(w => {
    while (w.length > width) { if (cur) { out.push(cur); cur = ''; } out.push(w.slice(0, width)); w = w.slice(width); }
    if (!cur) cur = w; else if ((cur + ' ' + w).length <= width) cur += ' ' + w; else { out.push(cur); cur = w; }
  });
  out.push(cur); return out;
}
function ticketText(s, copy = false) {
  const st = S.settings, L = [];
  L.push(center(st.name.toUpperCase()), center(st.tagline)); if (st.address) L.push(center(st.address)); if (st.phone) L.push(center('Tél. ' + st.phone));
  L.push(line('='));
  if (copy) L.push(center('*** DUPLICATA ***'));
  L.push(lr('Ticket N° ' + pad(s.no, 5), ddmmyy(s.at) + ' ' + hhmm(s.at)));
  L.push(lr('Lieu : ' + s.locName, ''), lr('Servi par : ' + s.byName, ''));
  if (s.client) L.push('Client : ' + s.client);
  L.push(line());
  s.lines.forEach(l => {
    if (l.kind === 'billard') { wrapName(l.name, W).forEach(x => L.push(x)); if (l.from) wrapName('  transfert depuis ' + l.from, W).forEach(x => L.push(x)); L.push(lr('  Temps ' + durShort(l.minutes), num(l.price))); }
    else { const nm = wrapName((l.qty > 1 ? l.qty + 'x ' : '') + l.name, W - 10); nm.forEach((x, i) => L.push(i === nm.length - 1 ? lr(x, num(l.price * l.qty)) : x)); if (l.qty > 1) L.push('   (' + num(l.price) + ' /u)'); }
  });
  L.push(line());
  if (s.discount) { L.push(lr('Sous-total', num(s.subtotal))); L.push(lr(s.method === 'offert' ? 'Offert' : 'Remise', '-' + num(s.discount))); }
  L.push(lr('TOTAL', num(s.total) + ' DH'));
  L.push(lr('Paiement', METHODS[s.method]));
  if (s.method === 'especes' && s.given != null) { L.push(lr('Reçu', num(s.given))); L.push(lr('Rendu', num(s.change))); }
  if (s.void) { L.push(line()); L.push(center('*** TICKET ANNULÉ ***')); L.push(center(s.void.reason)); }
  L.push(line('='), center(st.footer), '');
  return L.join('\n');
}
function doPrint(text, a4 = false) {
  const pa = $('#print-area'); pa.className = a4 ? 'a4' : '';
  if (a4) pa.innerHTML = text; else pa.textContent = text;
  setTimeout(() => window.print(), 60);
}
function printTicket(s, copy = false) { doPrint(ticketText(s, copy)); }
function reportLines(title, sales, extra = []) {
  const T = totals(sales), st = S.settings, L = [center(st.name.toUpperCase()), center(title), line('='), ...extra, line()];
  L.push(lr('Tickets', T.n), lr('CA total', num(T.ca)), lr('  dont billard', num(T.billard)), lr('  dont café/snacks', num(T.cafe)), lr('Panier moyen', num(T.avg)), lr('Remises', num(T.disc)), lr('Annulations', `${T.voids} / ${num(T.voidAmt)}`));
  L.push(line(), 'PAIEMENTS'); Object.entries(T.byMethod).forEach(([k, v]) => L.push(lr('  ' + METHODS[k], num(v))));
  L.push(line(), 'CATÉGORIES'); Object.entries(T.byCat).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => L.push(lr('  ' + catName(k), num(v))));
  if (Object.keys(T.byTable).length) { L.push(line(), 'BILLARD'); Object.entries(T.byTable).forEach(([k, v]) => L.push(lr(`  ${k} (${durShort(v.min)})`, num(v.v)))); }
  L.push(line(), 'EMPLOYÉS'); Object.entries(T.byEmp).forEach(([k, v]) => L.push(lr('  ' + k, num(v))));
  return L;
}
function printShift(r) {
  const L = reportLines(`RAPPORT SHIFT #${r.no}`, S.sales.filter(s => s.shiftId === r.id), [
    lr('Responsable', r.respName), lr('Ouvert', ddmmyy(r.openedAt) + ' ' + hhmm(r.openedAt)), lr('Clôturé', ddmmyy(r.closedAt) + ' ' + hhmm(r.closedAt)), lr('Par', r.closedBy || '')]);
  L.push(line('='), 'CAISSE', lr('Fond de caisse', num(r.float)), lr('+ Ventes espèces', num(r.cash)), lr('+ Entrées', num(r.mIn)), lr('- Sorties', num(r.mOut)), lr('= Attendu', num(r.expected)), lr('Compté', num(r.counted)), lr('ÉCART', (r.diff > 0 ? '+' : '') + num(r.diff)), lr('Carte (TPE)', num(r.card)));
  if (r.note) L.push('Note : ' + r.note);
  L.push(line('='), '', 'Signature responsable :', '', '');
  doPrint(L.join('\n'));
}
function printDay(d, z) {
  const sales = S.sales.filter(s => s.dayId === d.id), shifts = S.shifts.filter(s => s.dayId === d.id);
  const L = reportLines(z ? 'RAPPORT Z — CLÔTURE' : 'RAPPORT X — LECTURE', sales, [lr('Journée', ddmmyy(d.openedAt)), lr('Ouverture', hhmm(d.openedAt) + ' · ' + (d.openedByName || '')), lr(z ? 'Clôture' : 'Édité', hhmm(d.closedAt || Date.now()))]);
  if (shifts.length) { L.push(line(), 'SHIFTS'); shifts.forEach(s => L.push(lr(`  #${s.no} ${s.respName}`, num(s.ca)), lr('    écart caisse', (s.diff > 0 ? '+' : '') + num(s.diff)))); }
  const mv = S.moves.filter(m => m.dayId === d.id);
  if (mv.length) { L.push(line(), 'MOUVEMENTS DE CAISSE'); mv.forEach(m => L.push(lr('  ' + (m.type === 'in' ? '+ ' : '- ') + m.label.slice(0, 20), num(m.amount)))); }
  L.push(line('='), '');
  doPrint(L.join('\n'));
}

/* ============================ Évènements ============================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) {
    if (ui.bell && !e.target.closest('#bell-panel') && !e.target.closest('#bell')) { ui.bell = false; renderBell(); }
    return;
  }
  const fn = A[el.dataset.act]; if (!fn) return;
  if (ui.bell && el.dataset.act !== 'toggleBell' && el.dataset.act !== 'goAlert') { ui.bell = false; renderBell(); }
  bumpMgr(); fn(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pos-search') { ui.posSearch = t.value; $('#pos-grid').innerHTML = posGrid(); }
  else if (t.id === 't-search') { ui.ticketsSearch = t.value; const pos = t.selectionStart; render(); const n = $('#t-search'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (t.id === 's-search') { ui.stockSearch = t.value; const pos = t.selectionStart; render(); const n = $('#s-search'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'device-user') {
    S.deviceUser = t.value; const u = me(); log(u ? `${u.name} prend l’appareil` : 'Appareil libéré'); save();
    toast(u ? `Bonjour ${u.name} !` : 'Aucun employé sélectionné.'); render();
  } else if (t.dataset.set) {
    if (!isMgr()) { toast('Mode gérant requis.', 'warn'); return render(); }
    const k = t.dataset.set, v = t.type === 'number' ? (parseFloat(t.value) || 0) : t.value;
    if (k.startsWith('billing.')) S.settings.billing[k.split('.')[1]] = Math.max(0, v); else S.settings[k] = v;
    if (k === 'salleCount') S.settings.salleCount = Math.max(0, Math.min(40, Math.round(v)));
    log(`Réglage « ${k} » modifié`); save(); bumpMgr(); render(); toast('Réglage enregistré.');
  } else if (t.dataset.tbl != null) {
    if (!isMgr()) return render();
    const tb = S.tables[+t.dataset.tbl], k = t.dataset.k;
    if (k === 'rate') { const v = parseFloat(t.value); if (!(v >= 0)) return render(); if (tb.session) { toast('Changement de tarif appliqué au prochain démarrage uniquement si la table est libre.', 'warn'); return render(); } log(`Tarif ${tb.name} : ${tb.rate} → ${v} DH/h`); tb.rate = v; }
    else { const v = t.value.trim(); if (v) { log(`Table renommée ${tb.name} → ${v}`); tb.name = v; } }
    save(); render();
  } else if (t.id === 'import-file' && t.files[0]) {
    const f = t.files[0], rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.products) || !Array.isArray(d.tables) || !Array.isArray(d.sales)) throw new Error('format');
        withMgr(() => confirmBox('Importer une sauvegarde', `Remplacer les données actuelles par <b>${esc(f.name)}</b> (${d.sales.length} tickets) ?`, 'Importer', () => { S = Object.assign(seed(), d); S.settings = Object.assign(seed().settings, d.settings); save(); render(); toast('Sauvegarde importée.'); }, true));
      } catch (err) { toast('Fichier de sauvegarde invalide.', 'crit'); }
      t.value = '';
    };
    rd.readAsText(f);
  }
});
document.addEventListener('keydown', e => {
  if (ui.modal?.key && e.key !== 'Escape' && !e.target.matches('input,textarea,select')) { ui.modal.key(e); return; }
  if (e.key === 'Escape') { if (ui.modal) closeModal(); else if (ui.bell) { ui.bell = false; renderBell(); } }
  else if (e.key === 'Enter' && ui.modal?.ok && e.target.matches('#modal-root input:not([type=checkbox])')) { e.preventDefault(); ui.modal.ok(); }
});
window.addEventListener('storage', e => { if (e.key === LS_KEY && !ui.modal) { load(); render(); } });

/* ============================ Démarrage ============================ */
load();
render();
</script>
</body>
